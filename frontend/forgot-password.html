
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Helper Buddy</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="auth-container">
        <h2>Forgot Password?</h2>
        <p>Enter your registered Gmail to receive an OTP.</p>

        <input type="email" id="email" placeholder="Enter your Gmail">

        <button type="button" onclick="sendPasswordResetOTP()">
            Send OTP
        </button>

        <div id="otpSection" style="display:none;">
            <input type="text" id="otp" placeholder="Enter 6-digit OTP"
                   maxlength="6" inputmode="numeric">

            <button type="button" onclick="verifyPasswordResetOTP()">
                Verify OTP
            </button>
        </div>

        <p id="message"></p>
        <a href="login.html">Back to Login</a>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
