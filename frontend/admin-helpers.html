<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Helpers</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:30px;
}

h1{
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#2563eb;
    color:white;
}

img{
    width:60px;
    height:60px;
    object-fit:cover;
    border-radius:50%;
}

button{
    background:red;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:darkred;
}

</style>

</head>
<body>

<h1>Manage Helpers</h1>

<table>

<thead>

<tr>
<th>Photo</th>
<th>Name</th>
<th>Profession</th>
<th>City</th>
<th>Phone</th>
<th>Experience</th>
<th>Action</th>
</tr>

</thead>

<tbody id="helperTable">

</tbody>

</table>

<script>

async function loadHelpers(){

    const response = await fetch("http://localhost:5000/api/admin/helpers");

    const data = await response.json();

    let html = "";

    data.helpers.forEach(helper=>{

        html += `
        <tr>

            <td>
                <img src="http://localhost:5000/uploads/${helper.photo}">
            </td>

            <td>${helper.name}</td>

            <td>${helper.profession}</td>

            <td>${helper.city}</td>

            <td>${helper.phone}</td>

            <td>${helper.experience}</td>

            <td>
                <button onclick="deleteHelper('${helper._id}')">
                    Delete
                    </button>
            </td>

        </tr>
        `;

    });

    document.getElementById("helperTable").innerHTML = html;

}

loadHelpers();

async function deleteHelper(id) {

    const confirmDelete = confirm("Are you sure you want to delete this helper?");

    if (!confirmDelete) return;

    try {

        const response = await fetch(
            `http://localhost:5000/api/admin/helper/${id}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (data.success) {

            alert("Helper deleted successfully!");

            loadHelpers();

        } else {

            alert(data.message);

        }

    } catch (error) {

        console.error(error);
        alert("Something went wrong.");

    }

}

</script>

</body>
</html>
